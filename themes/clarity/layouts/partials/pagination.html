{{ if gt .TotalPages 1 }}
<nav class="pagination" aria-label="文章分页">
  {{ if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">← 上一页</a>{{ else }}<span aria-disabled="true">← 上一页</span>{{ end }}
  <span class="pagination-status">{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{ if .HasNext }}<a href="{{ .Next.URL }}" rel="next">下一页 →</a>{{ else }}<span aria-disabled="true">下一页 →</span>{{ end }}
</nav>
{{ end }}
